# LLM RAG 통신사 상담 - 스파이크(테스트) 환경
# 전 구성요소를 컨테이너로 실행한다. 호스트에는 Docker만 있으면 된다.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # qdrant 이미지에는 curl이 없다. 내장 TCP 체크로 대체.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollamadata:/root/.ollama
    environment:
      # CPU 환경 튜닝: 동시 로드 모델 수를 제한해 RAM 초과를 막는다
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  api:
    build: ./app
    container_name: rag-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-exaone3.5:2.4b}
      DEFAULT_EMBED_MODEL: ${DEFAULT_EMBED_MODEL:-bge-m3}
      DEFAULT_STORE: ${DEFAULT_STORE:-pgvector}
    volumes:
      - ./app:/srv/app
      - ./data:/srv/data
      - ./results:/srv/results
      - ./docs:/srv/docs
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  pgdata:
  qdrantdata:
  ollamadata:
